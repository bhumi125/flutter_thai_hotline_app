name: flutter_thai_hotline_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1 #ใช้งาน Material Widget (แยกออกจาก Flutter SDK)
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0 #ใช้งานฟอนต์จาก Google Fonts (Kanit)
  font_awesome_flutter: ^11.0.0 #ใช้งานไอคอนจาก Font Awesome
  url_launcher: ^6.3.3 #ใช้งานการโทรออกจากเบอร์สายด่วน

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 #ใช้สร้างไอคอนแอพ

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/aboutme/
    - assets/images/bank/
    - assets/images/emergency/
    - assets/images/pubutil/
    - assets/images/travel/
